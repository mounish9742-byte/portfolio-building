<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <link rel="icon" type="image/png" href="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mNk+M9QDwADhgGAWjR9awAAAABJRU5ErkJggg==" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mounish | Portfolio</title>
  
  <!-- SEO Meta Tags -->
  <meta name="description" content="Portfolio of Mounish, BTech in CSIT student and Web Developer. Exploring elegant software, core computer science, and modern web technologies." />
  <meta name="keywords" content="Mounish, Portfolio, BTech CSIT, Web Developer, React, Next.js, HTML, Python, Java, C" />
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  
  <style>
    /* Custom Scrollbar for premium visual feel */
    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(226, 232, 240, 0.8);
      border-radius: 9999px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: rgba(203, 213, 225, 1);
    }

    /* Glassmorphism utility */
    .glass-effect {
      background: rgba(255, 255, 255, 0.7);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-900 font-sans antialiased selection:bg-indigo-100 selection:text-indigo-900">
  
  <!-- ROOT CONTAINER FOR REACT APP -->
  <div id="root"></div>

  <!-- CDN Script Loading at Bottom of Body for Guaranteed Parse Order -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    // Tailwind Config Customizations for Play CDN
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            outfit: ['Outfit', 'sans-serif'],
          }
        }
      }
    }
  </script>
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- React Code Compiled by Babel Standalone -->
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // Custom Minimalist SVG Icon Components
    const IconLock = () => (
      <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
    );
    const IconUnlock = () => (
      <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 9.9-1"></path></svg>
    );
    const IconPencil = () => (
      <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M12 20h9"></path><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"></path></svg>
    );
    const IconTrash = () => (
      <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path><line x1="10" y1="11" x2="10" y2="17"></line><line x1="14" y1="11" x2="14" y2="17"></line></svg>
    );
    const IconPlus = () => (
      <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
    );
    const IconGithub = () => (
      <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M9 19c-5 1.5-5-2.5-7-3m14 6v-3.87a3.37 3.37 0 0 0-.94-2.61c3.14-.35 6.44-1.54 6.44-7A5.44 5.44 0 0 0 20 4.77 5.07 5.07 0 0 0 19.91 1S18.73.65 16 2.48a13.38 13.38 0 0 0-7 0C6.27.65 5.09 1 5.09 1A5.07 5.07 0 0 0 5 4.77a5.44 5.44 0 0 0-1.5 3.78c0 5.42 3.3 6.61 6.44 7A3.37 3.37 0 0 0 9 18.13V22"></path></svg>
    );
    const IconLinkedin = () => (
      <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M16 8a6 6 0 0 1 6 6v7h-4v-7a2 2 0 0 0-2-2 2 2 0 0 0-2 2v7h-4v-7a6 6 0 0 1 6-6z"></path><rect x="2" y="9" width="4" height="12"></rect><circle cx="4" cy="4" r="2"></circle></svg>
    );
    const IconMail = () => (
      <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path><polyline points="22,6 12,13 2,6"></polyline></svg>
    );
    const IconExternal = () => (
      <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="7" y1="17" x2="17" y2="7"></line><polyline points="7 7 17 7 17 17"></polyline></svg>
    );
    const IconSchool = () => (
      <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M22 10v6M2 10l10-5 10 5-10 5z"></path><path d="M6 12v5c0 2 2 3 6 3s6-1 6-3v-5"></path></svg>
    );
    const IconCheck = () => (
      <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
    );
    const IconX = () => (
      <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
    );
    const IconAward = () => (
      <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="8" r="7"></circle><polyline points="8.21 13.89 7 23 12 20 17 23 15.79 13.88"></polyline></svg>
    );

    function App() {
      // --- STATE SYSTEM ---
      const [isAdminMode, setIsAdminMode] = useState(false);
      const [showAdminToast, setShowAdminToast] = useState(false);

      // Hero State
      const [hero, setHero] = useState({
        name: 'Mounish',
        headline: 'BTech in CSIT • Web Developer',
        tagline: 'First-year CSIT student passionate about building elegant software, exploring core computer science concepts, and learning new technologies.',
        avatar: 'assets/images/mounish_avatar.png'
      });
      const [isEditingHero, setIsEditingHero] = useState(false);
      const [heroForm, setHeroForm] = useState({ ...hero });

      // Skills Inventory
      const [skills, setSkills] = useState({
        languages: ['C', 'Python', 'Java'],
        webdev: ['HTML']
      });
      const [isEditingSkills, setIsEditingSkills] = useState(false);
      const [skillsForm, setSkillsForm] = useState({
        languages: skills.languages.join(', '),
        webdev: skills.webdev.join(', ')
      });

      // Projects State
      const [projects, setProjects] = useState([
        {
          id: 1,
          title: 'Typing Test',
          description: 'An interactive, clean typing speed and accuracy testing tool. Measures real-time WPM, character count, error analysis, and graphs speed progress over time.',
          tags: ['React', 'Tailwind', 'JavaScript'],
          link: '#',
          type: 'typing'
        },
        {
          id: 2,
          title: 'Smart Medicine Reminder',
          description: 'A practical utility application that lets users schedule dosage reminders, log intake adherence, and track medication stock levels with mock browser notifications.',
          tags: ['React', 'Tailwind', 'LocalStorage'],
          link: '#',
          type: 'medicine'
        },
        {
          id: 3,
          title: '2D Graphics Editor',
          description: 'A visual design and rendering mini-tool allowing users to create geometric shapes, control colors, manipulate canvas elements, and export work as SVGs.',
          tags: ['HTML5 Canvas', 'SVG', 'React State'],
          link: '#',
          type: 'graphics'
        }
      ]);
      const [isEditingProject, setIsEditingProject] = useState(false);
      const [projectForm, setProjectForm] = useState({ id: null, title: '', description: '', tags: '', link: '', type: 'custom' });

      // Certifications State
      const [certifications, setCertifications] = useState([
        {
          id: 1,
          title: 'CS50x: Introduction to Computer Science',
          issuer: 'Harvard University / edX',
          date: 'March 2026',
          link: '#'
        },
        {
          id: 2,
          title: 'Responsive Web Design Certification',
          issuer: 'freeCodeCamp',
          date: 'April 2026',
          link: '#'
        },
        {
          id: 3,
          title: 'Python Programming Specialization',
          issuer: 'Coursera / Rice University',
          date: 'May 2026',
          link: '#'
        }
      ]);
      const [isEditingCert, setIsEditingCert] = useState(false);
      const [certForm, setCertForm] = useState({ id: null, title: '', issuer: '', date: '', link: '' });

      // Active Project Demo Drawer
      const [activeDemoProject, setActiveDemoProject] = useState(null);

      // Contact Form State
      const [contact, setContact] = useState({ name: '', email: '', subject: '', message: '' });
      const [formErrors, setFormErrors] = useState({});
      const [toastMessage, setToastMessage] = useState(null);

      // --- ACTIONS & HANDLERS ---
      const toggleAdminMode = () => {
        const nextMode = !isAdminMode;
        setIsAdminMode(nextMode);
        if (nextMode) {
          setShowAdminToast(true);
          setTimeout(() => setShowAdminToast(false), 5000);
        }
      };

      // Hero Handlers
      const handleEditHeroSubmit = (e) => {
        e.preventDefault();
        setHero({ ...heroForm });
        setIsEditingHero(false);
        triggerSuccessToast('Hero section updated successfully!');
      };

      // Skills Handlers
      const handleEditSkillsSubmit = (e) => {
        e.preventDefault();
        setSkills({
          languages: skillsForm.languages.split(',').map(s => s.trim()).filter(Boolean),
          webdev: skillsForm.webdev.split(',').map(s => s.trim()).filter(Boolean)
        });
        setIsEditingSkills(false);
        triggerSuccessToast('Skills inventory updated successfully!');
      };

      // Project Modals & Form
      const openProjectModal = (proj = null) => {
        if (proj) {
          setProjectForm({
            id: proj.id,
            title: proj.title,
            description: proj.description,
            tags: proj.tags.join(', '),
            link: proj.link,
            type: proj.type || 'custom'
          });
        } else {
          setProjectForm({ id: null, title: '', description: '', tags: '', link: '#', type: 'custom' });
        }
        setIsEditingProject(true);
      };

      const handleProjectSubmit = (e) => {
        e.preventDefault();
        if (!projectForm.title || !projectForm.description) return;

        const formattedTags = projectForm.tags.split(',').map(t => t.trim()).filter(Boolean);

        if (projectForm.id) {
          // Edit
          setProjects(projects.map(p => p.id === projectForm.id ? { ...p, title: projectForm.title, description: projectForm.description, tags: formattedTags, link: projectForm.link } : p));
          triggerSuccessToast('Project details updated!');
        } else {
          // Add
          const newProj = {
            id: Date.now(),
            title: projectForm.title,
            description: projectForm.description,
            tags: formattedTags,
            link: projectForm.link,
            type: 'custom'
          };
          setProjects([...projects, newProj]);
          triggerSuccessToast('New project added to your portfolio!');
        }
        setIsEditingProject(false);
      };

      const handleDeleteProject = (id, e) => {
        e.stopPropagation();
        setProjects(projects.filter(p => p.id !== id));
        triggerSuccessToast('Project deleted successfully.');
      };

      // Certification Modals & Form
      const openCertModal = (cert = null) => {
        if (cert) {
          setCertForm({
            id: cert.id,
            title: cert.title,
            issuer: cert.issuer,
            date: cert.date,
            link: cert.link
          });
        } else {
          setCertForm({ id: null, title: '', issuer: '', date: '', link: '#' });
        }
        setIsEditingCert(true);
      };

      const handleCertSubmit = (e) => {
        e.preventDefault();
        if (!certForm.title || !certForm.issuer) return;

        if (certForm.id) {
          // Edit
          setCertifications(certifications.map(c => c.id === certForm.id ? { ...c, title: certForm.title, issuer: certForm.issuer, date: certForm.date, link: certForm.link } : c));
          triggerSuccessToast('Certification updated!');
        } else {
          // Add
          const newCert = {
            id: Date.now(),
            title: certForm.title,
            issuer: certForm.issuer,
            date: certForm.date || 'Present',
            link: certForm.link
          };
          setCertifications([...certifications, newCert]);
          triggerSuccessToast('Certification added!');
        }
        setIsEditingCert(false);
      };

      const handleDeleteCert = (id, e) => {
        e.stopPropagation();
        setCertifications(certifications.filter(c => c.id !== id));
        triggerSuccessToast('Certification deleted.');
      };

      // Contact Form Handlers
      const handleContactChange = (e) => {
        setContact({ ...contact, [e.target.name]: e.target.value });
      };

      const handleContactSubmit = (e) => {
        e.preventDefault();
        const errors = {};
        if (!contact.name.trim()) errors.name = 'Name is required';
        if (!contact.email.trim()) {
          errors.email = 'Email is required';
        } else if (!/\S+@\S+\.\S+/.test(contact.email)) {
          errors.email = 'Invalid email address';
        }
        if (!contact.message.trim()) errors.message = 'Message is required';

        if (Object.keys(errors).length > 0) {
          setFormErrors(errors);
          return;
        }

        setFormErrors({});
        triggerSuccessToast(`Thank you, ${contact.name}! Your message has been sent to Mounish.`);
        setContact({ name: '', email: '', subject: '', message: '' });
      };

      const triggerSuccessToast = (msg) => {
        setToastMessage(msg);
        setTimeout(() => setToastMessage(null), 4000);
      };

      // --- SUB-WIDGET COMPONENTS (Mini-demos) ---

      // 1. TYPING TEST WIDGET
      const TypingTestWidget = () => {
        const textToType = "Computer Science and Information Technology is the engine of modern innovation.";
        const [typedText, setTypedText] = useState('');
        const [wpm, setWpm] = useState(0);
        const [accuracy, setAccuracy] = useState(100);
        const [isStarted, setIsStarted] = useState(false);
        const [startTime, setStartTime] = useState(null);
        const [isFinished, setIsFinished] = useState(false);
        const inputRef = useRef(null);

        const handleInputChange = (e) => {
          const value = e.target.value;
          if (!isStarted) {
            setIsStarted(true);
            setStartTime(Date.now());
          }

          setTypedText(value);

          // Accuracy Calc
          let correctChars = 0;
          for (let i = 0; i < value.length; i++) {
            if (value[i] === textToType[i]) correctChars++;
          }
          const acc = value.length > 0 ? Math.round((correctChars / value.length) * 100) : 100;
          setAccuracy(acc);

          // WPM Calc
          const timeElapsed = (Date.now() - startTime) / 1000 / 60; // in minutes
          if (timeElapsed > 0) {
            const words = value.length / 5;
            setWpm(Math.round(words / timeElapsed));
          }

          // Finish Check
          if (value.length >= textToType.length) {
            setIsFinished(true);
          }
        };

        const resetTest = () => {
          setTypedText('');
          setWpm(0);
          setAccuracy(100);
          setIsStarted(false);
          setIsFinished(false);
          setStartTime(null);
          setTimeout(() => inputRef.current?.focus(), 50);
        };

        return (
          <div className="bg-slate-50 border border-slate-200/80 rounded-xl p-6 font-sans">
            <h4 className="text-sm font-semibold text-slate-400 uppercase tracking-wider mb-2">Simulated Interactive Prototype</h4>
            <h3 className="text-xl font-bold text-slate-900 mb-4">Speed Typing Test</h3>
            
            <p className="bg-white border border-slate-200 rounded-lg p-4 font-mono text-sm text-slate-600 mb-4 leading-relaxed select-none">
              {textToType.split('').map((char, index) => {
                let colorClass = "text-slate-400";
                if (index < typedText.length) {
                  colorClass = typedText[index] === char ? "text-indigo-600 font-medium" : "text-rose-500 bg-rose-50 font-medium";
                }
                return <span key={index} className={colorClass}>{char}</span>;
              })}
            </p>

            <input
              ref={inputRef}
              type="text"
              value={typedText}
              onChange={handleInputChange}
              disabled={isFinished}
              placeholder="Start typing the text above to test WPM..."
              className="w-full px-4 py-3 bg-white border border-slate-200 rounded-lg font-mono text-sm focus:outline-none focus:ring-2 focus:ring-indigo-600 focus:border-transparent transition-all mb-4"
            />

            <div className="grid grid-cols-3 gap-4 mb-4 text-center">
              <div className="bg-white border border-slate-100 rounded-lg p-3">
                <span className="block text-2xl font-bold text-slate-800 font-outfit">{wpm}</span>
                <span className="text-xs text-slate-400 font-medium uppercase">WPM</span>
              </div>
              <div className="bg-white border border-slate-100 rounded-lg p-3">
                <span className="block text-2xl font-bold text-slate-800 font-outfit">{accuracy}%</span>
                <span className="text-xs text-slate-400 font-medium uppercase">Accuracy</span>
              </div>
              <div className="bg-white border border-slate-100 rounded-lg p-3">
                <span className="block text-2xl font-bold text-slate-800 font-outfit">
                  {isStarted && !isFinished ? Math.max(0, Math.round((Date.now() - startTime) / 1000)) + 's' : '0s'}
                </span>
                <span className="text-xs text-slate-400 font-medium uppercase">Time</span>
              </div>
            </div>

            {isFinished && (
              <div className="bg-emerald-50 border border-emerald-200 text-emerald-800 p-4 rounded-lg text-sm mb-4 text-center font-medium animate-fade-in">
                🎉 Completed! Speed: {wpm} WPM | Accuracy: {accuracy}%
              </div>
            )}

            <button
              onClick={resetTest}
              className="w-full py-2 bg-slate-900 text-white hover:bg-indigo-600 rounded-lg text-sm font-semibold transition-all duration-300 shadow-sm"
            >
              Reset Test
            </button>
          </div>
        );
      };

      // 2. MEDICINE REMINDER WIDGET
      const MedicineReminderWidget = () => {
        const [meds, setMeds] = useState([
          { id: 1, name: 'Vitamin D3', time: '08:00 AM', status: 'Taken' },
          { id: 2, name: 'Omega-3 Acid', time: '01:30 PM', status: 'Pending' }
        ]);
        const [newMedName, setNewMedName] = useState('');
        const [newMedTime, setNewMedTime] = useState('09:00 AM');

        const addMedicine = (e) => {
          e.preventDefault();
          if (!newMedName.trim()) return;
          const newMed = {
            id: Date.now(),
            name: newMedName,
            time: newMedTime,
            status: 'Pending'
          };
          setMeds([...meds, newMed]);
          setNewMedName('');
        };

        const toggleStatus = (id) => {
          setMeds(meds.map(m => m.id === id ? { ...m, status: m.status === 'Taken' ? 'Pending' : 'Taken' } : m));
        };

        const deleteMed = (id) => {
          setMeds(meds.filter(m => m.id !== id));
        };

        return (
          <div className="bg-slate-50 border border-slate-200/80 rounded-xl p-6 font-sans">
            <h4 className="text-sm font-semibold text-slate-400 uppercase tracking-wider mb-2">Simulated Interactive Prototype</h4>
            <h3 className="text-xl font-bold text-slate-900 mb-4">Smart Medicine Reminder</h3>

            <form onSubmit={addMedicine} className="flex gap-2 mb-4">
              <input
                type="text"
                value={newMedName}
                onChange={(e) => setNewMedName(e.target.value)}
                placeholder="e.g. Paracetamol"
                className="flex-1 px-3 py-2 bg-white border border-slate-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-indigo-600 focus:border-transparent transition-all"
              />
              <select
                value={newMedTime}
                onChange={(e) => setNewMedTime(e.target.value)}
                className="px-3 py-2 bg-white border border-slate-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-indigo-600 transition-all text-slate-600"
              >
                <option>08:00 AM</option>
                <option>09:00 AM</option>
                <option>01:30 PM</option>
                <option>06:00 PM</option>
                <option>09:30 PM</option>
              </select>
              <button
                type="submit"
                className="px-4 py-2 bg-slate-900 text-white rounded-lg text-sm font-semibold hover:bg-indigo-600 transition-all shadow-sm"
              >
                Add
              </button>
            </form>

            <div className="space-y-2 max-h-48 overflow-y-auto mb-4 pr-1">
              {meds.length === 0 ? (
                <p className="text-center text-sm text-slate-400 py-6">No scheduled reminders</p>
              ) : (
                meds.map((med) => (
                  <div key={med.id} className="flex items-center justify-between bg-white border border-slate-200/60 p-3 rounded-lg hover:border-slate-300 transition-all">
                    <div className="flex items-center gap-3">
                      <button
                        onClick={() => toggleStatus(med.id)}
                        className={`w-5 h-5 rounded-full border flex items-center justify-center transition-all ${
                          med.status === 'Taken' 
                            ? 'bg-emerald-500 border-emerald-500 text-white' 
                            : 'border-slate-300 hover:border-slate-400 bg-white'
                        }`}
                      >
                        {med.status === 'Taken' && <IconCheck />}
                      </button>
                      <div>

      // 3. 2D GRAPHICS EDITOR WIDGET
      const GraphicsEditorWidget = () => {
        const canvasRef = useRef(null);
        const [color, setColor] = useState('#4f46e5');
        const [tool, setTool] = useState('brush'); // brush, line, circle, rect
        const [lineWidth, setLineWidth] = useState(4);
        const [isDrawing, setIsDrawing] = useState(false);
        const [startPos, setStartPos] = useState({ x: 0, y: 0 });

        useEffect(() => {
          // Clear canvas to white initially
          const canvas = canvasRef.current;
          if (!canvas) return;
          const ctx = canvas.getContext('2d');
          ctx.fillStyle = '#ffffff';
          ctx.fillRect(0, 0, canvas.width, canvas.height);
        }, []);

        const startDrawing = (e) => {
          const canvas = canvasRef.current;
          const rect = canvas.getBoundingClientRect();
          const x = e.clientX - rect.left;
          const y = e.clientY - rect.top;
          setIsDrawing(true);
          setStartPos({ x, y });

          if (tool === 'brush') {
            const ctx = canvas.getContext('2d');
            ctx.beginPath();
            ctx.moveTo(x, y);
            ctx.strokeStyle = color;
            ctx.lineWidth = lineWidth;
            ctx.lineCap = 'round';
          }
        };

        const draw = (e) => {
          if (!isDrawing) return;
          const canvas = canvasRef.current;
          const ctx = canvas.getContext('2d');
          const rect = canvas.getBoundingClientRect();
          const x = e.clientX - rect.left;
          const y = e.clientY - rect.top;

          if (tool === 'brush') {
            ctx.lineTo(x, y);
            ctx.stroke();
          }
        };

        const stopDrawing = (e) => {
          if (!isDrawing) return;
          setIsDrawing(false);

          const canvas = canvasRef.current;
          const ctx = canvas.getContext('2d');
          const rect = canvas.getBoundingClientRect();
          const x = e.clientX - rect.left;
          const y = e.clientY - rect.top;

          ctx.strokeStyle = color;
          ctx.fillStyle = color + '40'; // transparency
          ctx.lineWidth = lineWidth;

          if (tool === 'line') {
            ctx.beginPath();
            ctx.moveTo(startPos.x, startPos.y);
            ctx.lineTo(x, y);
            ctx.stroke();
          } else if (tool === 'rect') {
            ctx.beginPath();
            ctx.rect(startPos.x, startPos.y, x - startPos.x, y - startPos.y);
            ctx.fill();
            ctx.stroke();
          } else if (tool === 'circle') {
            ctx.beginPath();
            const radius = Math.sqrt(Math.pow(x - startPos.x, 2) + Math.pow(y - startPos.y, 2));
            ctx.arc(startPos.x, startPos.y, radius, 0, 2 * Math.PI);
            ctx.fill();
            ctx.stroke();
          }
        };

        const clearCanvas = () => {
          const canvas = canvasRef.current;
          const ctx = canvas.getContext('2d');
          ctx.fillStyle = '#ffffff';
          ctx.fillRect(0, 0, canvas.width, canvas.height);
        };

        return (
          <div className="bg-slate-50 border border-slate-200/80 rounded-xl p-6 font-sans">
            <h4 className="text-sm font-semibold text-slate-400 uppercase tracking-wider mb-2">Simulated Interactive Prototype</h4>
            <h3 className="text-xl font-bold text-slate-900 mb-4">2D Canvas Graphics Editor</h3>

            <div className="flex flex-wrap gap-2 mb-4 justify-between items-center">
              {/* Tools */}
              <div className="flex bg-white border border-slate-200 rounded-lg p-0.5 shadow-sm">
                {['brush', 'line', 'rect', 'circle'].map(t => (
                  <button
                    key={t}
                    onClick={() => setTool(t)}
                    className={`px-2.5 py-1 text-xs font-semibold capitalize rounded-md transition-all ${
                      tool === t ? 'bg-slate-900 text-white' : 'text-slate-500 hover:text-slate-800'
                    }`}
                  >
                    {t}
                  </button>
                ))}
              </div>

              {/* Color & Size */}
              <div className="flex items-center gap-3">
                <input
                  type="color"
                  value={color}
                  onChange={(e) => setColor(e.target.value)}
                  className="w-8 h-8 rounded-full border border-slate-300 cursor-pointer overflow-hidden p-0 bg-transparent"
                />
                <input
                  type="range"
                  min="1"
                  max="20"
                  value={lineWidth}
                  onChange={(e) => setLineWidth(Number(e.target.value))}
                  className="w-20 accent-indigo-600"
                />
              </div>
            </div>

            {/* Canvas */}
            <canvas
              ref={canvasRef}
              width={400}
              height={220}
              onMouseDown={startDrawing}
              onMouseMove={draw}
              onMouseUp={stopDrawing}
              onMouseLeave={() => setIsDrawing(false)}
              className="w-full bg-white border border-slate-200/80 rounded-lg shadow-inner cursor-crosshair mb-4 block touch-none"
            />

            <button
              onClick={clearCanvas}
              className="w-full py-2 bg-slate-900 hover:bg-indigo-600 text-white rounded-lg text-sm font-semibold transition-all duration-300 shadow-sm"
            >
              Clear Canvas
            </button>
          </div>
        );
      };
